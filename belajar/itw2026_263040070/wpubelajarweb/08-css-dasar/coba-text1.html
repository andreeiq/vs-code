<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coba Text - Decoration & Transform</title>
    <style>
        h1 {
            font-size: 40px;
            text-align: center;
            text-transform: uppercase;
            text-decoration: underline overline;
            text-decoration-style: wavy;
            text-decoration-color: lightblue;
            text-decoration-skip-ink: none;
        }

        h2 {
            font-size: 30px;
            text-align: right;
            color: crimson;
        }

        p {
            font-size: 26px;
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <h1>Hello, CSS!</h1>

    <h2>Belajar web di WPUCourse.id</h2>

    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Dolore quia nobis amet nam accusantium nisi pariatur incidunt, vel temporibus nihil aspernatur architecto eveniet cum, magnam deleniti illum molestias odio alias ea delectus doloribus debitis itaque?</p>
</body>
</html>
