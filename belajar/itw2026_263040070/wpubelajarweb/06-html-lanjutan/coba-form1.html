
<!DOCTYPE html>
<html>
<head>
    <title>Contoh Elemen Form</title>
</head>
<body>

    <h1>Contoh elemen-elemen form</h1>

    <form>
        Nama:
        <input type="text" placeholder="Masukkan nama">
        <br>

        Password:
        <input type="password">
        <br>

        Email:
        <input type="email">
        <br>

        Angka:
        <input type="number" style="width: 60px;">
        <br>

        Tanggal:
        <input type="date">
        <br>

        Pilih Warna:
        <input type="color" value="#00cba9">
        <br>

        <input type="submit" value="Kirim!">
    </form>

</body>
</html>
